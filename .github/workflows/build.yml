name: GitHub Actions Maven Build Example
on:
  push:
    branches: [ main ]
jobs:
  build-on-ubuntu:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Step 1 - Checkout main branch from GitHub
        uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Step 2 - Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: 11

      - name: Step 3 - Build Maven Project
        run: mvn --batch-mode clean install package -DskipTests

      - name: Step 4 - run test cases
        run: mvn --batch-mode -Dmaven.test.failure.ignore=true test

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B 
          jacoco:prepare-agent 
          verify 
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar 
          jacoco:report
          -Dsonar.coverage.exclusions=**/presentation/**/*.java
          -Dsonar.projectKey=SE-Project-team-2026_Vehicle-Rental-Management-System
          -Dsonar.organization=SE-Project-team-2026
